services:
  mysql:
    image: mysql:8.4
    container_name: utetra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: utetra_db
      MYSQL_USER: utetra_user
      MYSQL_PASSWORD: utetra_pass
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - utetra_mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - utetra-net

  adminer:
    image: adminer:latest
    container_name: utetra-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - utetra-net

volumes:
  utetra_mysql_data:

networks:
  utetra-net:
    driver: bridge