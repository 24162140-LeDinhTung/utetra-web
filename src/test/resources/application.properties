spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:utetra_test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.mail.host=localhost
spring.mail.port=1
spring.mail.username=
spring.mail.password=
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
payment.vnpay.tmn-code=TESTSHOP
payment.vnpay.hash-secret=test-vnpay-secret
payment.momo.partner-code=TESTMOMO
payment.momo.access-key=test-access
payment.momo.secret-key=test-momo-secret
payment.momo.ipn-url=https://example.test/api/payment/momo/ipn
logging.level.org.hibernate=WARN

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:test-data.sql
