spring:
  datasource:
    # Kết nối tới MySQL trong Docker (Đã đổi port về 3307 cho khớp với docker-compose.yml)
    url: jdbc:mysql://localhost:3307/utetra_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: utetra       # Đã đổi về utetra
    password: utetra123    # Đã đổi về utetra123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Đã đổi từ update thành validate (vì chúng ta dùng Flyway quản lý DB)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.utetra: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG