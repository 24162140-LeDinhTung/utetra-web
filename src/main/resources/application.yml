spring:
  application:
    name: utetra

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:utetra_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8&connectTimeout=10000&socketTimeout=10000
    username: ${DB_USER:utetra}
    password: ${DB_PASSWORD:utetra123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dinhtung11012202@gmail.com}
    password: ${MAIL_PASSWORD:xxkj skoi llca njdl}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
    # Cấu hình UTF-8 được chuyển sang đây theo chuẩn Spring Boot mới
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

server:
  port: 8080

jwt:
  secret: utetra-super-secret-key-change-in-production-minimum-256-bits-for-hs256-algorithm
  access-expire-minutes: 15
  refresh-expire-days: 7

# ================== UPLOAD (LOCAL STORAGE) ==================
app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    url-prefix: /uploads

logging:
  level:
    root: INFO
    com.utetra: INFO